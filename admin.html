<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم أهل كار | إدارة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة Firebase لإدارة قاعدة البيانات -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            padding: 30px;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.85);
            padding: 20px 30px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header h1 {
            color: #d4af37;
            font-size: 24px;
        }
        .stats {
            color: #9ca3af;
            font-size: 14px;
        }
        .orders-grid {
            display: grid;
            gap: 20px;
        }
        .order-card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: border-color 0.3s;
        }
        .order-card:hover {
            border-color: #d4af37;
        }
        .order-info h3 {
            color: #d4af37;
            margin-bottom: 5px;
            font-size: 18px;
        }
        .order-info p {
            color: #d4af37;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .order-info p span {
            color: #e5e7eb;
        }
        .no-orders {
            text-align: center;
            color: #9ca3af;
            background: rgba(17, 24, 39, 0.5);
            padding: 40px;
            border-radius: 12px;
            border: 1px dashed #374151;
            font-size: 16px;
        }
        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: #ef4444;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>لوحة تحكم طلبات أهل كار</h1>
            <div class="stats" id="orderCount">جاري تحميل الطلبات...</div>
        </div>

        <div id="ordersContainer" class="orders-grid">
            <!-- سيتم تحميل الطلبات هنا تلقائياً -->
        </div>
    </div>

    <script>
        // إعدادات ربط Firebase الدائمة لمشروع ahl-car
        const firebaseConfig = {
            apiKey: "AIzaSyCe4nQE1-wtPPsr7AaC4bSRuSij8_bG6yQ",
            authDomain: "ahl-car.firebaseapp.com",
            databaseURL: "https://ahl-car-default-rtdb.firebaseio.com",
            projectId: "ahl-car",
            storageBucket: "ahl-car.firebasestorage.app",
            messagingSenderId: "498410798661",
            appId: "1:498410798661:web:363897bf34d3a2ceb7ed2c",
            measurementId: "G-XB0WHKT335"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const ordersContainer = document.getElementById('ordersContainer');
        const orderCountElement = document.getElementById('orderCount');

        // استماع للتحديثات المباشرة من قاعدة البيانات
        database.ref('orders').on('value', (snapshot) => {
            ordersContainer.innerHTML = '';
            const data = snapshot.val();

            if (!data) {
                ordersContainer.innerHTML = '<div class="no-orders">لا توجد طلبات جديدة حتى الآن.</div>';
                orderCountElement.innerText = 'إجمالي الطلبات: 0';
                return;
            }

            const ordersKeys = Object.keys(data);
            orderCountElement.innerText = `إجمالي الطلبات: ${ordersKeys.length}`;

            ordersKeys.forEach((key) => {
                const order = data[key];
                
                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div class="order-info">
                        <h3>رقم الطلب: ${order.orderId || key}</h3>
                        <p>اسم العميل: <span>${order.name}</span></p>
                        <p>رقم الجوال: <span dir="ltr">${order.phone}</span></p>
                        <p>السيارة المطلوبة: <span>${order.car}</span></p>
                        <p>ملاحظات: <span>${order.notes || 'لا توجد ملاحظات'}</span></p>
                        <p style="color:#9ca3af; font-size:12px; margin-top:8px;">وقت الطلب: ${order.date || 'غير محدد'}</p>
                    </div>
                    <div>
                        <button class="btn-delete" onclick="deleteOrder('${key}')">حذف الطلب</button>
                    </div>
                `;
                ordersContainer.appendChild(card);
            });
        });

        // دالة حذف طلب من قاعدة البيانات
        function deleteOrder(orderKey) {
            if (confirm("هل أنت متأكد من حذف هذا الطلب نهائياً؟")) {
                database.ref('orders/' + orderKey).remove()
                    .then(() => {
                        // يتم التحديث تلقائياً عبر مراقب قاعدة البيانات
                    })
                    .catch((error) => {
                        alert("حدث خطأ أثناء الحذف.");
                    });
            }
        }
    </script>
</body>
</html>
