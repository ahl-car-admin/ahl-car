<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أهل كار | حجز السيارات الفاخرة</title>
    <!-- استيراد خط أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة Firebase لإدارة قاعدة البيانات -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 10%, #1a2238 0%, #0b0f19 70%);
        }
        .container {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 480px;
            padding: 30px 25px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-icon {
            width: 60px;
            height: 60px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 12px auto;
            color: #d4af37;
            font-size: 24px;
            background: rgba(212, 175, 55, 0.05);
        }
        .header h1 {
            color: #d4af37;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .card-box {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(55, 65, 81, 0.6);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            margin-bottom: 25px;
        }
        .card-box h3 {
            color: #f3f4f6;
            font-size: 16px;
            margin-bottom: 6px;
        }
        .card-box p {
            color: #9ca3af;
            font-size: 13px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e5e7eb;
            font-size: 13px;
            text-align: right;
        }
        /* تصميم أزرار الاختيار المزدوجة */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .option-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-family: 'Cairo', sans-serif;
        }
        .option-btn.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
            color: #d4af37;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: right;
        }
        input::placeholder {
            color: #6b7280;
        }
        input:focus, select:focus {
            border-color: #d4af37;
            outline: none;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }
        .btn-submit {
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            color: #0b0f19;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .secure-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            color: #9ca3af;
            font-size: 12px;
        }
        .secure-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }
        .footer-copy {
            text-align: center;
            color: #6b7280;
            font-size: 11px;
            margin-top: 20px;
        }
        .alert {
            display: none;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-icon">🚗</div>
            <h1>أهل كار</h1>
            <div class="card-box">
                <h3>بيانات الطلب</h3>
                <p>أدخل بياناتك وسنتواصل معك فوراً بأفضل العروض</p>
            </div>
        </div>

        <form id="carForm">
            <!-- نوع العميل -->
            <div class="form-group">
                <label>نوع العميل *</label>
                <div class="options-grid">
                    <button type="button" class="option-btn active" onclick="setClientType('أفراد', this)">أفراد</button>
                    <button type="button" class="option-btn" onclick="setClientType('شركات', this)">شركات</button>
                </div>
                <input type="hidden" id="clientType" value="أفراد">
            </div>

            <!-- طريقة الدفع -->
            <div class="form-group">
                <label>طريقة الدفع *</label>
                <div class="options-grid">
                    <button type="button" class="option-btn active" onclick="setPayType('كاش', this)">كاش</button>
                    <button type="button" class="option-btn" onclick="setPayType('تمويل', this)">تمويل</button>
                </div>
                <input type="hidden" id="payType" value="كاش">
            </div>

            <!-- الاسم الكامل -->
            <div class="form-group">
                <label for="clientName">الاسم الكامل *</label>
                <input type="text" id="clientName" required placeholder="محمد أحمد">
            </div>

            <!-- رقم الجوال -->
            <div class="form-group">
                <label for="clientPhone">رقم الجوال *</label>
                <input type="tel" id="clientPhone" required placeholder="05xxxxxxxx" dir="ltr" style="text-align: right;">
            </div>

            <!-- المدينة -->
            <div class="form-group">
                <label for="city">المدينة *</label>
                <input type="text" id="city" required placeholder="الدمام">
            </div>

            <!-- السيارة المطلوبة (اختيار أو كتابة حرة) -->
            <div class="form-group">
                <label for="carModel">السيارة المطلوبة *</label>
                <input type="text" id="carModel" list="carsList" required placeholder="اختر أو اكتب اسم الموديل والفئة...">
                <datalist id="carsList">
                    <option value="مرسيدس S-Class">
                    <option value="بي إم دبليو الفئة السابعة">
                    <option value="رنج روفر أتوبيوغرافيا">
                    <option value="بورش كايين">
                    <option value="تويوتا لاندكروزر">
                    <option value="لكزس LX">
                    <option value="جينيسيس G90">
                    <option value="شيفروليه تاهو">
                </datalist>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">أرسل طلبك الآن &gt;</button>
        </form>

        <div class="secure-footer">
            <div class="secure-dot"></div>
            <span>آمن وموثوق • لن يتم مشاركة بياناتك</span>
        </div>

        <div class="footer-copy">
            © 2026 أهل كار - جميع الحقوق محفوظة
        </div>

        <div id="successAlert" class="alert alert-success">
            تم إرسال طلبك بنجاح! رقم طلبك: <span id="displayOrderNum" style="font-weight:bold;"></span>. سنقوم بالتواصل معك قريباً.
        </div>
    </div>

    <script>
        // دوال التحكم بالأزرار التفاعلية
        function setClientType(type, btnElement) {
            document.getElementById('clientType').value = type;
            const buttons = btnElement.parentElement.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function setPayType(type, btnElement) {
            document.getElementById('payType').value = type;
            const buttons = btnElement.parentElement.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // إعدادات ربط Firebase الدائمة لمشروع ahl-car
        const firebaseConfig = {
            apiKey: "AIzaSyCe4nQE1-wtPPsr7AaC4bSRuSij8_bG6yQ",
            authDomain: "ahl-car.firebaseapp.com",
            databaseURL: "https://ahl-car-default-rtdb.firebaseio.com",
            projectId: "ahl-car",
            storageBucket: "ahl-car.firebasestorage.app",
            messagingSenderId: "498410798661",
            appId: "1:498410798661:web:363897bf34d3a2ceb7ed2c",
            measurementId: "G-XB0WHKT335"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        document.getElementById('carForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "جاري إرسال الطلب...";

            const clientType = document.getElementById('clientType').value;
            const payType = document.getElementById('payType').value;
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const city = document.getElementById('city').value;
            const car = document.getElementById('carModel').value;
            
            // توليد رقم طلب فريد
            const orderNumber = "AC-" + Math.floor(100000 + Math.random() * 900000);
            const timestamp = new Date().toLocaleString('ar-SA');

            const orderData = {
                orderId: orderNumber,
                clientType: clientType,
                payType: payType,
                name: name,
                phone: phone,
                city: city,
                car: car,
                status: "New",
                date: timestamp
            };

            database.ref('orders/' + orderNumber).set(orderData)
                .then(() => {
                    document.getElementById('carForm').style.display = 'none';
                    const alertBox = document.getElementById('successAlert');
                    document.getElementById('displayOrderNum').innerText = orderNumber;
                    alertBox.style.display = 'block';
                })
                .catch((error) => {
                    alert("حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.");
                    btn.disabled = false;
                    btn.innerText = "أرسل طلبك الآن >";
                });
        });
    </script>
</body>
</html>
